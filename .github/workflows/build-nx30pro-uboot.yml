name: NX30 Pro U-Boot candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nx30pro-uboot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      UBOOT_REPOSITORY: https://github.com/hanwckf/bl-mt798x
      UBOOT_SHA: 36916669d0874306638196c5327a20c2ef215bed
    steps:
      - name: Check out this build project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pinned build prerequisites
        run: |
          mkdir -p "$GITHUB_WORKSPACE/uboot-artifact/logs"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison device-tree-compiler flex gcc-aarch64-linux-gnu \
            libssl-dev python3

      - name: Clone pinned boot loader source
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/nx30pro-uboot" "$GITHUB_WORKSPACE/uboot-artifact/logs"
          git clone --filter=blob:none --no-checkout "$UBOOT_REPOSITORY" "$RUNNER_TEMP/nx30pro-uboot/source"
          git -C "$RUNNER_TEMP/nx30pro-uboot/source" checkout --detach "$UBOOT_SHA"
          test "$(git -C "$RUNNER_TEMP/nx30pro-uboot/source" rev-parse HEAD)" = "$UBOOT_SHA"

      - name: Build and verify the candidate boot loader
        shell: bash
        run: |
          set -Eeuo pipefail
          sh devices/nx30pro/build/build-uboot.sh \
            --lock devices/nx30pro/uboot/uboot-source-lock.json \
            --source-dir "$RUNNER_TEMP/nx30pro-uboot/source" \
            --artifact-dir "$GITHUB_WORKSPACE/uboot-artifact"

      - name: Upload boot loader candidates, provenance and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nx30pro-uboot-candidate-112m
          path: uboot-artifact/
          if-no-files-found: error
          retention-days: 30
