name: NX30 Pro restricted-recovery U-Boot

# Manual only. This workflow builds a boot loader candidate; it is never
# triggered by a push, a pull request or a schedule, and it contains no flash,
# erase or device command. Accepting a candidate is a separate, explicitly
# authorized step recorded in devices/nx30pro/docs/UBOOT-TEST-REPORT.md.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nx30pro-uboot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      UBOOT_REPOSITORY: https://github.com/Yuzhii0718/bl-mt798x-dhcpd
      UBOOT_SHA: e4cf4dc72d451dc7a86c9508390ad5a2e50743c4
      UBOOT_LOCK: devices/nx30pro/uboot/uboot-source-lock.json
    steps:
      - name: Check out this build project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install the build prerequisites the lock names
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/uboot-artifact/logs"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison device-tree-compiler flex gcc-aarch64-linux-gnu \
            libssl-dev python3 npm
          aarch64-linux-gnu-gcc --version | awk 'NR==1'
          node --version
          npm --version
          python3 --version

      - name: Run the repository preflight and the lock gate
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/validate.sh
          # Device scoped on purpose: another device's test set must not decide
          # whether this boot loader may be built. The repository wide suite runs
          # in validate.yml.
          python3 -m unittest \
            tests.structure.test_nx30pro_uboot_contract \
            tests.scripts.test_nx30pro_uboot_build \
            tests.workflows.test_workflows -v
          python3 devices/nx30pro/build/uboot_lock.py check --lock "$UBOOT_LOCK" \
            | tee "$RUNNER_TEMP/uboot-build-plan.json"
          # The plan is the only description of what this job is allowed to build.
          grep -q 'h3c_magic-nx30-pro' "$RUNNER_TEMP/uboot-build-plan.json"
          grep -q "$UBOOT_SHA" "$RUNNER_TEMP/uboot-build-plan.json"

      - name: Clone the pinned boot loader source
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/nx30pro-uboot"
          git clone --filter=blob:none --no-checkout "$UBOOT_REPOSITORY" \
            "$RUNNER_TEMP/nx30pro-uboot/source"
          git -C "$RUNNER_TEMP/nx30pro-uboot/source" checkout --detach "$UBOOT_SHA"
          test "$(git -C "$RUNNER_TEMP/nx30pro-uboot/source" rev-parse HEAD)" = "$UBOOT_SHA"

      - name: Build and verify the candidate boot loader
        shell: bash
        run: |
          set -Eeuo pipefail
          sh devices/nx30pro/build/build-uboot.sh \
            --lock devices/nx30pro/uboot/uboot-source-lock.json \
            --source-dir "$RUNNER_TEMP/nx30pro-uboot/source" \
            --artifact-dir "$GITHUB_WORKSPACE/uboot-artifact"

      - name: Upload boot loader candidates and provenance
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nx30pro-uboot-candidate-112m
          path: |
            uboot-artifact/images/
            uboot-artifact/build-report.json
            uboot-artifact/uboot-source-lock.json
            uboot-artifact/FLASH-TARGETS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nx30pro-uboot-candidate-logs
          path: uboot-artifact/logs/
          if-no-files-found: warn
          retention-days: 30
