name: TR3000 Lite firmware

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tr3000-lite
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      UPSTREAM_PROJECT: https://github.com/weekdaycare/immortalwrt-mt7981-cudy-tr3000.git
      UPSTREAM_PROJECT_SHA: cc777dfa3c1964518ddb2c310e8570830b11e954
      SOURCE_REPOSITORY: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
      SOURCE_SHA: ec9ef10efc65da1e6d1de4e2c043c0e13d08eed8
    steps:
      - name: Check out this build project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          mkdir -p "$GITHUB_WORKSPACE/lite-artifact/logs"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc build-essential bison ccache clang flex g++ gawk gcc-multilib \
            gettext git libelf-dev libncurses-dev libssl-dev make \
            python3 python3-distutils python3-setuptools rsync subversion \
            swig time unzip wget zlib1g-dev file

      - name: Restore compiler and download caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ runner.temp }}/tr3000-lite/ccache
            ${{ runner.temp }}/tr3000-lite/dl
          key: tr3000-lite-${{ runner.os }}-${{ env.SOURCE_SHA }}-${{ hashFiles('feeds/devices/tr3000-lite.lock', 'configs/lite.seed') }}

      - name: Clone pinned upstream project and firmware source
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/tr3000-lite" "$GITHUB_WORKSPACE/lite-artifact/logs"
          git clone --filter=blob:none --no-checkout "$UPSTREAM_PROJECT" "$RUNNER_TEMP/tr3000-lite/project"
          git -C "$RUNNER_TEMP/tr3000-lite/project" checkout --detach "$UPSTREAM_PROJECT_SHA"
          test "$(git -C "$RUNNER_TEMP/tr3000-lite/project" rev-parse HEAD)" = "$UPSTREAM_PROJECT_SHA"
          git clone --filter=blob:none --no-checkout "$SOURCE_REPOSITORY" "$RUNNER_TEMP/tr3000-lite/source"
          git -C "$RUNNER_TEMP/tr3000-lite/source" checkout --detach "$SOURCE_SHA"
          test "$(git -C "$RUNNER_TEMP/tr3000-lite/source" rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Build, verify and package Lite firmware
        shell: bash
        env:
          CCACHE_DIR: ${{ runner.temp }}/tr3000-lite/ccache
          DOWNLOAD_DIR: ${{ runner.temp }}/tr3000-lite/dl
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"
          (( jobs > 4 )) && jobs=4
          sh scripts/build-lite.sh \
            --source-dir "$RUNNER_TEMP/tr3000-lite/source" \
            --upstream-dir "$RUNNER_TEMP/tr3000-lite/project" \
            --artifact-dir "$GITHUB_WORKSPACE/lite-artifact" \
            --jobs "$jobs"

      - name: Upload firmware, provenance and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tr3000-lite-128m-ubootmod-112m
          path: lite-artifact/
          if-no-files-found: error
          retention-days: 30
