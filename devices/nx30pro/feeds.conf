# NX30 Pro device feeds.
#
# The feeds of the selected source are pinned to their commits, so the build
# input does not drift with the moving branches. The revisions are the ones
# recorded in devices/nx30pro/source-lock.json; all four openwrt-21.02 feed
# branches are frozen, so these commits are the heads the source was selected
# against. No branch reference is used here: a branch name is informational
# only and is never resolved by the build.
src-git-full packages https://github.com/immortalwrt/packages.git^e09f3c7d1903cfe7f523e209ab3ec778013ba309
src-git-full luci https://github.com/immortalwrt/luci.git^5829eabba50ec0afa17d2ee486bc90dc15180c34
src-git-full routing https://github.com/openwrt/routing.git^a9e43101bb726070cbf81b6225fc0625f4a4a5e5
src-git-full telephony https://github.com/openwrt/telephony.git^920fbc5c0a2e4badf51bceff42e9a1e3eb693462
