# TR3000-Lite ships openssh-server, not dropbear. OpenSSH defaults to
# "PermitRootLogin prohibit-password", which silently rejects the root
# password the operator sets in LuCI and leaves the device reachable only
# through a serial console. The Lite firmware already requires a non-empty
# root password for the plant HTTPS gate and the remote access controller,
# so the password is a mandatory secret rather than an optional one.
PermitRootLogin yes
PasswordAuthentication yes
